<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OBS Remote</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0e0e10; color: #efeff1; height: 100vh; overflow: hidden; }

  .header { background: #18181b; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #2f2f35; flex-shrink: 0; }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .header .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.live { background: #eb0400; animation: pulse 1.5s infinite; }
  .dot.offline { background: #53535f; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  .dashboard { display: grid; grid-template-columns: 260px 1fr 300px; grid-template-rows: 1fr auto; gap: 12px; padding: 12px; height: calc(100vh - 49px); }

  .card { background: #18181b; border-radius: 10px; padding: 14px; border: 1px solid #2f2f35; }
  .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #adadb8; margin-bottom: 10px; }

  /* Left panel */
  .left-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

  /* Controls card */
  .timecodes { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .timecode { font-family: 'SF Mono', 'Menlo', monospace; font-size: 28px; font-weight: 700; color: #efeff1; line-height: 1.2; }
  .timecode.rec { font-size: 18px; color: #eb0400; }
  .controls { display: flex; flex-direction: column; gap: 8px; }
  .btn { padding: 10px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; width: 100%; text-align: center; }
  .btn:active { transform: scale(0.97); }
  .btn-stream { background: #eb0400; color: white; }
  .btn-stream:hover { background: #ff2d29; }
  .btn-stream.off { background: #2f2f35; color: #efeff1; }
  .btn-stream.off:hover { background: #3f3f46; }
  .btn-record { background: #bf3030; color: white; }
  .btn-record:hover { background: #d44040; }
  .btn-record.off { background: #2f2f35; color: #efeff1; }
  .btn-record.off:hover { background: #3f3f46; }
  .btn-pause { background: #2f2f35; color: #efeff1; }
  .btn-pause:hover { background: #3f3f46; }

  /* Scenes */
  .scene-list { display: flex; flex-direction: column; gap: 6px; }
  .scene-btn { padding: 8px 14px; background: #2f2f35; border: 2px solid transparent; border-radius: 8px; color: #efeff1; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; text-align: left; width: 100%; }
  .scene-btn:hover { background: #3f3f46; }
  .scene-btn.active { border-color: #9147ff; background: #2a1f47; }

  /* Center - Preview + Chat */
  .center-panel { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .preview-card { display: flex; flex-direction: column; min-height: 0; flex: 3; }
  .preview-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0; }
  .preview-wrapper { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 8px; overflow: hidden; min-height: 0; }
  .preview-img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .preview-fps { display: flex; align-items: center; gap: 6px; }
  .preview-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
  .preview-badge.live { background: #eb0400; color: white; }
  .preview-badge.off { background: #53535f; color: #adadb8; }
  .fps-btn { background: none; border: 1px solid #53535f; border-radius: 5px; color: #adadb8; padding: 3px 8px; cursor: pointer; font-size: 11px; }
  .fps-btn:hover { border-color: #adadb8; color: #efeff1; }
  .fps-btn.active { border-color: #9147ff; color: #9147ff; }

  /* Chat */
  .chat-card { flex: 2; display: flex; flex-direction: column; min-height: 0; }
  .chat-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; flex-shrink: 0; }
  .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
  .chat-msg { padding: 4px 8px; border-radius: 4px; font-size: 13px; line-height: 1.4; word-break: break-word; }
  .chat-msg:hover { background: #2f2f35; }
  .chat-user { font-weight: 700; }
  .chat-empty { color: #53535f; font-size: 13px; font-style: italic; padding: 12px; text-align: center; }
  .ding-toggle { background: none; border: 1px solid #53535f; border-radius: 5px; color: #adadb8; padding: 3px 8px; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px; }
  .ding-toggle:hover { border-color: #adadb8; color: #efeff1; }
  .ding-toggle.on { border-color: #9147ff; color: #9147ff; }

  /* Right panel */
  .right-panel { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }

  /* Sources */
  .source-list { display: flex; flex-direction: column; gap: 6px; }
  .source-item { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; background: #0e0e10; border-radius: 8px; }
  .source-row { display: flex; align-items: center; justify-content: space-between; }
  .source-info { display: flex; align-items: center; gap: 10px; }
  .source-name { font-size: 13px; font-weight: 500; }
  .source-audio { display: flex; align-items: center; gap: 8px; }

  .toggle { width: 38px; height: 20px; background: #53535f; border-radius: 10px; cursor: pointer; position: relative; transition: background 0.2s; border: none; flex-shrink: 0; }
  .toggle.on { background: #9147ff; }
  .toggle::after { content: ''; position: absolute; width: 14px; height: 14px; background: white; border-radius: 50%; top: 3px; left: 3px; transition: transform 0.2s; }
  .toggle.on::after { transform: translateX(18px); }

  .mute-btn { background: none; border: 1px solid #53535f; border-radius: 5px; color: #efeff1; padding: 4px 8px; cursor: pointer; font-size: 11px; transition: all 0.15s; flex-shrink: 0; }
  .mute-btn:hover { border-color: #adadb8; }
  .mute-btn.muted { background: #eb0400; border-color: #eb0400; }

  .volume-slider { flex: 1; accent-color: #9147ff; cursor: pointer; min-width: 0; }
  .vol-label { font-size: 10px; color: #adadb8; min-width: 32px; text-align: right; }

  /* Stats bar */
  .stats-bar { grid-column: 1 / -1; }
  .stats-row { display: flex; gap: 10px; }
  .stat { flex: 1; text-align: center; padding: 8px; background: #0e0e10; border-radius: 8px; }
  .stat .value { font-size: 18px; font-weight: 700; }
  .stat .label { font-size: 10px; color: #adadb8; margin-top: 2px; text-transform: uppercase; }

  .error-banner { position: fixed; top: 54px; left: 50%; transform: translateX(-50%); background: #5c1010; color: #ffb3b3; padding: 10px 24px; border-radius: 8px; text-align: center; display: none; z-index: 100; }
</style>
</head>
<body>

<div class="header">
  <h1>OBS Remote</h1>
  <div class="status">
    <div class="dot" id="streamDot"></div>
    <span id="streamLabel">--</span>
  </div>
</div>

<div id="error" class="error-banner"></div>

<div class="dashboard">
  <!-- LEFT: Controls + Scenes -->
  <div class="left-panel">
    <div class="card">
      <h2>Controls</h2>
      <div class="timecodes">
        <div class="timecode" id="streamTime">00:00:00</div>
        <div class="timecode rec" id="recordTime" style="display:none;">REC 00:00:00</div>
      </div>
      <div class="controls">
        <button class="btn btn-stream off" id="btnStream" onclick="toggleStream()">Start Stream</button>
        <button class="btn btn-record off" id="btnRecord" onclick="toggleRecord()">Start Recording</button>
        <button class="btn btn-pause" id="btnPause" onclick="togglePause()" style="display:none;">Pause</button>
      </div>
    </div>
    <div class="card">
      <h2>Scenes</h2>
      <div class="scene-list" id="sceneList"></div>
    </div>
  </div>

  <!-- CENTER: Preview + Chat -->
  <div class="center-panel">
    <div class="card preview-card">
      <div class="preview-toolbar">
        <h2 style="margin-bottom:0;">Preview</h2>
        <div class="preview-fps">
          <span id="previewBadge" class="preview-badge off">OFF</span>
          <button class="fps-btn" onclick="setPreviewFps(0)">Off</button>
          <button class="fps-btn" onclick="setPreviewFps(1)">1fps</button>
          <button class="fps-btn active" onclick="setPreviewFps(2)">2fps</button>
          <button class="fps-btn" onclick="setPreviewFps(5)">5fps</button>
        </div>
      </div>
      <div class="preview-wrapper">
        <img id="previewImg" class="preview-img" alt="OBS Preview" src="/api/preview">
      </div>
    </div>
    <div class="card chat-card">
      <div class="chat-header">
        <h2 style="margin-bottom:0;">Twitch Chat</h2>
        <button class="ding-toggle on" id="dingToggle" onclick="toggleDing()">Ding</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="chat-empty">Waiting for messages...</div>
      </div>
    </div>
  </div>

  <!-- RIGHT: Sources -->
  <div class="right-panel">
    <div class="card" style="flex:1;">
      <h2>Sources</h2>
      <div class="source-list" id="sourceList"></div>
    </div>
  </div>

  <!-- BOTTOM: Stats -->
  <div class="card stats-bar">
    <div class="stats-row">
      <div class="stat"><div class="value" id="statCpu">--</div><div class="label">CPU</div></div>
      <div class="stat"><div class="value" id="statFps">--</div><div class="label">FPS</div></div>
      <div class="stat"><div class="value" id="statMem">--</div><div class="label">RAM (MB)</div></div>
      <div class="stat"><div class="value" id="statDisk">--</div><div class="label">Disk (GB)</div></div>
      <div class="stat"><div class="value" id="statDrop">--</div><div class="label">Dropped</div></div>
    </div>
  </div>
</div>

<script>
let state = {};

// --- Ding sound (generated via Web Audio API) ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let dingEnabled = true;

function playDing() {
  if (!dingEnabled) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, audioCtx.currentTime);
  osc.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.08);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
  osc.start(audioCtx.currentTime);
  osc.stop(audioCtx.currentTime + 0.4);
}

function toggleDing() {
  dingEnabled = !dingEnabled;
  const btn = document.getElementById('dingToggle');
  btn.className = 'ding-toggle' + (dingEnabled ? ' on' : '');
  btn.textContent = dingEnabled ? 'Ding' : 'Ding Off';
}

// --- API ---
async function api(path, body) {
  try {
    const opts = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
    const res = await fetch('/api/' + path, opts);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    hideError();
    return data;
  } catch (err) {
    showError(err.message);
    throw err;
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = 'Error: ' + msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error').style.display = 'none';
}

async function refresh() {
  try {
    state = await api('status');
    render();
  } catch {}
}

function render() {
  const { stream, record, stats, scenes, scene, sources } = state;

  const dot = document.getElementById('streamDot');
  const label = document.getElementById('streamLabel');
  const btnStream = document.getElementById('btnStream');
  if (stream.active) {
    dot.className = 'dot live';
    label.textContent = 'LIVE';
    btnStream.className = 'btn btn-stream';
    btnStream.textContent = 'Stop Stream';
  } else {
    dot.className = 'dot offline';
    label.textContent = 'Offline';
    btnStream.className = 'btn btn-stream off';
    btnStream.textContent = 'Start Stream';
  }
  document.getElementById('streamTime').textContent = stream.timecode ? stream.timecode.split('.')[0] : '00:00:00';

  const btnRecord = document.getElementById('btnRecord');
  const btnPause = document.getElementById('btnPause');
  const recordTime = document.getElementById('recordTime');
  if (record.active) {
    btnRecord.className = 'btn btn-record';
    btnRecord.textContent = 'Stop Recording';
    btnPause.style.display = '';
    btnPause.textContent = record.paused ? 'Resume' : 'Pause';
    recordTime.style.display = '';
    recordTime.textContent = 'REC ' + (record.timecode ? record.timecode.split('.')[0] : '00:00:00');
  } else {
    btnRecord.className = 'btn btn-record off';
    btnRecord.textContent = 'Start Recording';
    btnPause.style.display = 'none';
    recordTime.style.display = 'none';
  }

  document.getElementById('statCpu').textContent = stats.cpu.toFixed(1) + '%';
  document.getElementById('statFps').textContent = stats.fps.toFixed(0);
  document.getElementById('statMem').textContent = stats.memory.toFixed(0);
  document.getElementById('statDisk').textContent = stats.disk.toFixed(1);
  const dropPct = stats.outputTotal > 0 ? ((stats.outputSkipped / stats.outputTotal) * 100).toFixed(2) : '0.00';
  document.getElementById('statDrop').textContent = dropPct + '%';

  const sceneList = document.getElementById('sceneList');
  sceneList.innerHTML = scenes.map(s =>
    `<button class="scene-btn ${s === scene ? 'active' : ''}" onclick="setScene('${s.replace(/'/g, "\\'")}')">${s}</button>`
  ).join('');

  const sourceList = document.getElementById('sourceList');
  sourceList.innerHTML = sources.map(s => {
    let audioRow = '';
    if (s.hasAudio) {
      audioRow = `
        <div class="source-audio">
          <button class="mute-btn ${s.muted ? 'muted' : ''}" onclick="toggleMute('${s.name.replace(/'/g, "\\'")}')">
            ${s.muted ? 'MUTED' : 'Mute'}
          </button>
          <input type="range" class="volume-slider" min="-60" max="0" step="1" value="${s.volumeDb}"
            onchange="setVolume('${s.name.replace(/'/g, "\\'")}', Number(this.value))"
            title="${s.volumeDb.toFixed(0)} dB">
          <span class="vol-label">${s.volumeDb.toFixed(0)} dB</span>
        </div>
      `;
    }
    return `
      <div class="source-item">
        <div class="source-row">
          <div class="source-info">
            <button class="toggle ${s.visible ? 'on' : ''}" onclick="toggleSource(${s.id})"></button>
            <span class="source-name">${s.name}</span>
          </div>
        </div>
        ${audioRow}
      </div>
    `;
  }).join('');
}

async function setScene(name) { await api('scene', { name }); refresh(); }
async function toggleSource(id) { await api('toggle-source', { id }); refresh(); }
async function toggleStream() {
  if (state.stream?.active && !confirm('Are you sure you want to stop the stream?')) return;
  await api('toggle-stream');
  refresh();
}
async function toggleRecord() { await api('toggle-record'); refresh(); }
async function togglePause() { await api('toggle-record-pause'); refresh(); }
async function toggleMute(name) { await api('toggle-mute', { name }); refresh(); }
async function setVolume(name, db) { await api('volume', { name, db }); }

// --- Preview ---
let previewFps = 2;
let previewTimer = null;

function setPreviewFps(fps) {
  previewFps = fps;
  document.querySelectorAll('.fps-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  const badge = document.getElementById('previewBadge');
  if (fps === 0) {
    badge.textContent = 'OFF';
    badge.className = 'preview-badge off';
  } else {
    badge.textContent = fps + ' FPS';
    badge.className = 'preview-badge live';
  }
  startPreviewLoop();
}

function startPreviewLoop() {
  if (previewTimer) clearInterval(previewTimer);
  if (previewFps === 0) return;
  previewTimer = setInterval(() => {
    const img = document.getElementById('previewImg');
    img.src = '/api/preview?t=' + Date.now();
  }, 1000 / previewFps);
}

// --- Chat polling ---
let lastChatTimestamp = Date.now();

async function pollChat() {
  try {
    const res = await fetch('/api/chat?since=' + lastChatTimestamp);
    const data = await res.json();
    if (data.messages && data.messages.length > 0) {
      const container = document.getElementById('chatMessages');
      // Remove "waiting" placeholder
      const empty = container.querySelector('.chat-empty');
      if (empty) empty.remove();

      for (const msg of data.messages) {
        const div = document.createElement('div');
        div.className = 'chat-msg';
        div.innerHTML = `<span class="chat-user" style="color:${msg.color}">${escapeHtml(msg.user)}</span>: ${escapeHtml(msg.message)}`;
        container.appendChild(div);
        lastChatTimestamp = msg.timestamp;
      }
      // Auto-scroll
      container.scrollTop = container.scrollHeight;
      // Play ding
      playDing();
    }
  } catch {}
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// --- Init ---
refresh();
setInterval(refresh, 2000);
startPreviewLoop();
setInterval(pollChat, 1500);
</script>
</body>
</html>
